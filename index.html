<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>EgoBall Multiplayer</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; -webkit-user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0b1220; font-family: system-ui, -apple-system, sans-serif; }
  #gameCanvas { display:block; background:#123; touch-action:none; }

  #hud { position:fixed; top:0; left:0; width:100%; display:flex; justify-content:center; padding-top:10px; pointer-events:none; z-index:5; }
  #scoreBox { background:rgba(0,0,0,0.45); color:#fff; padding:8px 22px; border-radius:12px; font-size:20px; font-weight:700; letter-spacing:1px; }
  #scoreBox .red { color:#ff5b5b; }
  #scoreBox .blue { color:#5b9bff; }

  #message { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); color:#fff; font-size:22px; font-weight:700; text-align:center; background:rgba(0,0,0,0.55); padding:16px 26px; border-radius:14px; z-index:6; display:none; max-width:80vw; }

  #fullscreenBtn { position:fixed; top:10px; right:10px; width:44px; height:44px; background:rgba(0,0,0,0.5); border:2px solid rgba(255,255,255,0.6); border-radius:10px; color:#fff; font-size:20px; display:flex; align-items:center; justify-content:center; z-index:10; cursor:pointer; }
  #fullscreenBtn:active { background:rgba(255,255,255,0.25); }

  #joystickZone { position:fixed; left:0; bottom:0; width:48%; height:50%; z-index:8; touch-action:none; }
  #joystickBase { position:absolute; width:110px; height:110px; border-radius:50%; background:rgba(255,255,255,0.15); border:2px solid rgba(255,255,255,0.35); display:none; pointer-events:none; }
  #joystickStick { position:absolute; width:50px; height:50px; border-radius:50%; background:rgba(255,255,255,0.55); display:none; pointer-events:none; }

  #kickBtn { position:fixed; right:26px; bottom:36px; width:84px; height:84px; border-radius:50%; background:rgba(255,80,80,0.55); border:2px solid rgba(255,255,255,0.6); color:#fff; font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; z-index:8; }
  #kickBtn:active { background:rgba(255,80,80,0.85); }

  #authOverlay { position:fixed; inset:0; background:linear-gradient(160deg,#0b1220,#132a4a); display:flex; align-items:center; justify-content:center; z-index:20; }
  #authBox { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.15); padding:28px 26px; border-radius:16px; width:min(90vw, 340px); color:#fff; }
  #authBox h1 { text-align:center; font-size:26px; margin-bottom:18px; letter-spacing:1px; }
  #authBox input { width:100%; padding:12px 14px; margin-bottom:12px; border-radius:10px; border:1px solid rgba(255,255,255,0.2); background:rgba(0,0,0,0.25); color:#fff; font-size:15px; }
  #authBox input::placeholder { color:rgba(255,255,255,0.5); }
  .authBtns { display:flex; gap:10px; margin-top:6px; }
  .authBtns button { flex:1; padding:12px; border:none; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; }
  #loginBtn { background:#3d7dff; color:#fff; }
  #registerBtn { background:rgba(255,255,255,0.12); color:#fff; }
  #authError { min-height:18px; color:#ff7a7a; font-size:13px; margin-top:10px; text-align:center; }

  @media (min-width: 900px) and (pointer: fine) {
    #joystickZone, #kickBtn { display:none; }
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="hud">
  <div id="scoreBox"><span class="red">0</span> &nbsp;-&nbsp; <span class="blue">0</span></div>
</div>

<div id="message"></div>

<button id="fullscreenBtn" title="To'liq ekran">⛶</button>

<div id="joystickZone">
  <div id="joystickBase"></div>
  <div id="joystickStick"></div>
</div>
<div id="kickBtn">URISH</div>

<div id="authOverlay">
  <div id="authBox">
    <h1>⚽ EgoBall</h1>
    <input id="usernameInput" type="text" placeholder="Foydalanuvchi nomi" maxlength="16" autocomplete="off">
    <input id="passwordInput" type="password" placeholder="Parol" autocomplete="off">
    <div class="authBtns">
      <button id="loginBtn">Kirish</button>
      <button id="registerBtn">Ro'yxatdan o'tish</button>
    </div>
    <div id="authError"></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

// ---------- Canvas sozlash ----------
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));
resizeCanvas();

let WORLD = { WORLD_WIDTH:800, WORLD_HEIGHT:400, FIELD_LEFT:50, FIELD_RIGHT:750, FIELD_TOP:50, FIELD_BOTTOM:350, GOAL_TOP:150, GOAL_BOTTOM:250, GOAL_DEPTH:20, PLAYER_RADIUS:15, BALL_RADIUS:9 };

let latestState = null;

// ---------- Autentifikatsiya ----------
const authOverlay = document.getElementById('authOverlay');
const usernameInput = document.getElementById('usernameInput');
const passwordInput = document.getElementById('passwordInput');
const authError = document.getElementById('authError');

document.getElementById('registerBtn').onclick = () => {
  authError.textContent = '';
  socket.emit('register', { username: usernameInput.value, password: passwordInput.value }, (res) => {
    authError.style.color = res.success ? '#7aff9c' : '#ff7a7a';
    authError.textContent = res.success ? "Ro'yxatdan o'tildi! Endi kiring." : res.message;
  });
};

document.getElementById('loginBtn').onclick = () => {
  authError.textContent = '';
  socket.emit('login', { username: usernameInput.value, password: passwordInput.value }, (res) => {
    if (res.success) {
      if (res.world) WORLD = res.world;
      authOverlay.style.display = 'none';
    } else {
      authError.style.color = '#ff7a7a';
      authError.textContent = res.message;
    }
  });
};

// ---------- Input holati ----------
const input = { x: 0, y: 0, kick: false };
const keys = { up:false, down:false, left:false, right:false };

function sendInput() {
  socket.emit('input', input);
}

function updateKeyboardVector() {
  let x = 0, y = 0;
  if (keys.left) x -= 1;
  if (keys.right) x += 1;
  if (keys.up) y -= 1;
  if (keys.down) y += 1;
  input.x = x;
  input.y = y;
  sendInput();
}

window.addEventListener('keydown', (e) => {
  let changed = true;
  const k = e.key.toLowerCase();
  if (k === 'arrowup' || k === 'w') keys.up = true;
  else if (k === 'arrowdown' || k === 's') keys.down = true;
  else if (k === 'arrowleft' || k === 'a') keys.left = true;
  else if (k === 'arrowright' || k === 'd') keys.right = true;
  else if (k === ' ') { input.kick = true; sendInput(); }
  else changed = false;
  if (changed) updateKeyboardVector();
});

window.addEventListener('keyup', (e) => {
  let changed = true;
  const k = e.key.toLowerCase();
  if (k === 'arrowup' || k === 'w') keys.up = false;
  else if (k === 'arrowdown' || k === 's') keys.down = false;
  else if (k === 'arrowleft' || k === 'a') keys.left = false;
  else if (k === 'arrowright' || k === 'd') keys.right = false;
  else if (k === ' ') { input.kick = false; sendInput(); }
  else changed = false;
  if (changed) updateKeyboardVector();
});

// ---------- Virtual joystick (telefon) ----------
const joystickZone = document.getElementById('joystickZone');
const joystickBase = document.getElementById('joystickBase');
const joystickStick = document.getElementById('joystickStick');
let joystickActive = false;
let joystickOrigin = { x:0, y:0 };
const JOY_RADIUS = 55;
let joystickTouchId = null;

function joystickStart(clientX, clientY) {
  joystickActive = true;
  joystickOrigin = { x: clientX, y: clientY };
  joystickBase.style.left = (clientX - 55) + 'px';
  joystickBase.style.top = (clientY - 55) + 'px';
  joystickStick.style.left = (clientX - 25) + 'px';
  joystickStick.style.top = (clientY - 25) + 'px';
  joystickBase.style.display = 'block';
  joystickStick.style.display = 'block';
}

function joystickMove(clientX, clientY) {
  if (!joystickActive) return;
  let dx = clientX - joystickOrigin.x;
  let dy = clientY - joystickOrigin.y;
  const dist = Math.hypot(dx, dy);
  if (dist > JOY_RADIUS) { dx = (dx/dist)*JOY_RADIUS; dy = (dy/dist)*JOY_RADIUS; }
  joystickStick.style.left = (joystickOrigin.x + dx - 25) + 'px';
  joystickStick.style.top = (joystickOrigin.y + dy - 25) + 'px';
  input.x = dx / JOY_RADIUS;
  input.y = dy / JOY_RADIUS;
  sendInput();
}

function joystickEnd() {
  joystickActive = false;
  joystickTouchId = null;
  joystickBase.style.display = 'none';
  joystickStick.style.display = 'none';
  input.x = 0; input.y = 0;
  sendInput();
}

joystickZone.addEventListener('touchstart', (e) => {
  const t = e.changedTouches[0];
  joystickTouchId = t.identifier;
  joystickStart(t.clientX, t.clientY);
}, { passive:true });

joystickZone.addEventListener('touchmove', (e) => {
  for (const t of e.changedTouches) {
    if (t.identifier === joystickTouchId) joystickMove(t.clientX, t.clientY);
  }
}, { passive:true });

joystickZone.addEventListener('touchend', (e) => {
  for (const t of e.changedTouches) {
    if (t.identifier === joystickTouchId) joystickEnd();
  }
});
joystickZone.addEventListener('touchcancel', joystickEnd);

// ---------- Urish tugmasi ----------
const kickBtn = document.getElementById('kickBtn');
kickBtn.addEventListener('touchstart', (e) => { e.preventDefault(); input.kick = true; sendInput(); }, { passive:false });
kickBtn.addEventListener('touchend', (e) => { e.preventDefault(); input.kick = false; sendInput(); }, { passive:false });
kickBtn.addEventListener('touchcancel', (e) => { input.kick = false; sendInput(); });

// ---------- To'liq ekran tugmasi ----------
const fullscreenBtn = document.getElementById('fullscreenBtn');
fullscreenBtn.addEventListener('click', () => {
  const el = document.documentElement;
  const isFull = document.fullscreenElement || document.webkitFullscreenElement;
  if (!isFull) {
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (req) req.call(el);
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if (exit) exit.call(document);
  }
});

// ---------- Socket holati ----------
socket.on('state', (state) => {
  latestState = state;
  document.querySelector('#scoreBox .red').textContent = state.score.red;
  document.querySelector('#scoreBox .blue').textContent = state.score.blue;

  const msgEl = document.getElementById('message');
  if (state.paused && state.pauseReason === 'waiting') {
    msgEl.style.display = 'block';
    msgEl.textContent = "Raqib kutilmoqda...";
  } else if (!state.paused) {
    msgEl.style.display = 'none';
  }
});

socket.on('goal', (data) => {
  const msgEl = document.getElementById('message');
  msgEl.style.display = 'block';
  msgEl.textContent = (data.team === 'red' ? "QIZIL" : "KO'K") + " JAMOA GOL URDI!";
  setTimeout(() => { msgEl.style.display = 'none'; }, 1700);
});

socket.on('matchEnd', (data) => {
  const msgEl = document.getElementById('message');
  msgEl.style.display = 'block';
  msgEl.textContent = (data.winningTeam === 'red' ? "QIZIL" : "KO'K") + " JAMOA G'OLIB BO'LDI!";
  setTimeout(() => { msgEl.style.display = 'none'; }, 3800);
});

// ---------- Render sikli ----------
function render() {
  requestAnimationFrame(render);
  if (!latestState) return;

  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  const scale = Math.min(w / WORLD.WORLD_WIDTH, h / WORLD.WORLD_HEIGHT) * 0.94;
  const offsetX = (w - WORLD.WORLD_WIDTH * scale) / 2;
  const offsetY = (h - WORLD.WORLD_HEIGHT * scale) / 2;

  const tx = (x) => offsetX + x * scale;
  const ty = (y) => offsetY + y * scale;

  // maydon foni
  ctx.fillStyle = '#1a7a3e';
  ctx.fillRect(tx(WORLD.FIELD_LEFT), ty(WORLD.FIELD_TOP), (WORLD.FIELD_RIGHT-WORLD.FIELD_LEFT)*scale, (WORLD.FIELD_BOTTOM-WORLD.FIELD_TOP)*scale);

  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 2 * scale;
  ctx.strokeRect(tx(WORLD.FIELD_LEFT), ty(WORLD.FIELD_TOP), (WORLD.FIELD_RIGHT-WORLD.FIELD_LEFT)*scale, (WORLD.FIELD_BOTTOM-WORLD.FIELD_TOP)*scale);

  // markaziy chiziq va doira
  const midX = (WORLD.FIELD_LEFT+WORLD.FIELD_RIGHT)/2;
  ctx.beginPath();
  ctx.moveTo(tx(midX), ty(WORLD.FIELD_TOP));
  ctx.lineTo(tx(midX), ty(WORLD.FIELD_BOTTOM));
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(tx(midX), ty((WORLD.FIELD_TOP+WORLD.FIELD_BOTTOM)/2), 45*scale, 0, Math.PI*2);
  ctx.stroke();

  // darvozalar
  ctx.strokeRect(tx(WORLD.FIELD_LEFT-WORLD.GOAL_DEPTH), ty(WORLD.GOAL_TOP), WORLD.GOAL_DEPTH*scale, (WORLD.GOAL_BOTTOM-WORLD.GOAL_TOP)*scale);
  ctx.strokeRect(tx(WORLD.FIELD_RIGHT), ty(WORLD.GOAL_TOP), WORLD.GOAL_DEPTH*scale, (WORLD.GOAL_BOTTOM-WORLD.GOAL_TOP)*scale);

  // o'yinchilar
  for (const p of latestState.players) {
    ctx.beginPath();
    ctx.arc(tx(p.x), ty(p.y), WORLD.PLAYER_RADIUS*scale, 0, Math.PI*2);
    ctx.fillStyle = p.team === 'red' ? '#ff4d4d' : '#4d8dff';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.font = `${12*scale}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(p.username, tx(p.x), ty(p.y) - WORLD.PLAYER_RADIUS*scale - 6);
  }

  // to'p
  const ball = latestState.ball;
  ctx.beginPath();
  ctx.arc(tx(ball.x), ty(ball.y), WORLD.BALL_RADIUS*scale, 0, Math.PI*2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.stroke();
}
render();
</script>
</body>
</html>
